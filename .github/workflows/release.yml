name: Publish Debian Live Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.profile }} release ISO
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, server]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools rsync grub-common librsvg2-bin fonts-dejavu-core

      - name: Fix live-build firmware index lookup
        run: |
          sudo bash scripts/patch-live-build-firmware-index.sh

      - name: Prepare lydsys include
        run: |
          install -D -m 0755 scripts/lydsys \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/sbin/lydsys"
          install -D -m 0755 scripts/lydhelp \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/bin/lydhelp"
          install -D -m 0755 scripts/lyd-btrfs-postinstall \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/sbin/lyd-btrfs-postinstall"
          if [ "${{ matrix.profile }}" = "desktop" ]; then
            bash scripts/install-grub-theme.sh \
              --root "profiles/desktop/config/includes.chroot" \
              --source "$GITHUB_WORKSPACE/themes/mystical/wallpaper/contents/images/1920x1080.svg" \
              --iso-output "profiles/desktop/config/includes.binary/boot/grub/themes"
            install -D -m 0755 scripts/9999-grub-theme.hook.binary \
              "profiles/desktop/config/hooks/live/9999-grub-theme.hook.binary"
            bash scripts/install-mystical-theme.sh \
              --root "profiles/desktop/config/includes.chroot" \
              --source "$GITHUB_WORKSPACE/themes/mystical"
          else
            bash scripts/install-grub-theme.sh \
              --root "profiles/server/config/includes.chroot" \
              --source "$GITHUB_WORKSPACE/themes/mystical/wallpaper/contents/images/1920x1080.svg"
          fi

      - name: Validate shell scripts
        run: |
          bash -n scripts/lydsys
          bash -n scripts/lydsetup
          bash -n scripts/lydhelp
          bash -n scripts/lyd-btrfs-postinstall
          bash -n scripts/install-mystical-theme.sh
          bash -n scripts/install-grub-theme.sh
          sh -n scripts/9999-grub-theme.hook.binary
          bash -n scripts/build-iso.sh
          bash -n scripts/patch-live-build-firmware-index.sh
          sh -n profiles/desktop/auto/config
          sh -n profiles/server/auto/config

      - name: Build ISO
        working-directory: profiles/${{ matrix.profile }}
        run: |
          chmod +x auto/config
          sudo lb clean --purge
          sudo lb config
          sudo lb build
          SOURCE_ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$SOURCE_ISO"
          ISO="lyd-debian-${{ matrix.profile }}-amd64.iso"
          mv -- "$SOURCE_ISO" "$ISO"
          sha256sum "$ISO" > "$ISO.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-iso
          path: |
            profiles/${{ matrix.profile }}/*.iso
            profiles/${{ matrix.profile }}/*.iso.sha256
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download both ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "lyd Debian Live $TAG" \
            --generate-notes
