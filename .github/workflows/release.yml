name: Publish Debian Live Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

# Keep rolling "latest" publications in order so an older build cannot
# overwrite a newer one if two main-branch builds finish close together.
concurrency:
  group: lyd-debian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.profile }} release ISO
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, server]

    steps:
      - name: Install Debian Trixie build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates make python3 live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools rsync grub-common librsvg2-bin fonts-dejavu-core

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare lydsys include
        run: |
          install -D -m 0755 scripts/lydsys \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/sbin/lydsys"
          install -D -m 0755 scripts/lydhelp \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/bin/lydhelp"
          install -D -m 0755 scripts/lydsetup \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/bin/lydsetup"
          install -D -m 0755 scripts/lyd-btrfs-postinstall \
            "profiles/${{ matrix.profile }}/config/includes.chroot/usr/local/sbin/lyd-btrfs-postinstall"
          if [ "${{ matrix.profile }}" = "server" ]; then
            install -D -m 0755 scripts/lyd-firewall-postinstall \
              "profiles/server/config/includes.chroot/usr/local/sbin/lyd-firewall-postinstall"
          fi
          bash scripts/stage-grub-btrfs.sh "profiles/${{ matrix.profile }}/config/includes.chroot"
          if [ "${{ matrix.profile }}" = "desktop" ]; then
            bash scripts/install-grub-theme.sh \
              --root "profiles/desktop/config/includes.chroot" \
              --source "$GITHUB_WORKSPACE/themes/mystical/wallpaper/contents/images/1920x1080.svg" \
              --iso-output "profiles/desktop/config/includes.binary/boot/grub/themes"
            install -D -m 0755 scripts/9999-grub-theme.hook.binary \
              "profiles/desktop/config/hooks/live/9999-grub-theme.hook.binary"
            bash scripts/install-mystical-theme.sh \
              --root "profiles/desktop/config/includes.chroot" \
              --source "$GITHUB_WORKSPACE/themes/mystical"
          else
            bash scripts/install-grub-theme.sh \
              --root "profiles/server/config/includes.chroot" \
              --source "$GITHUB_WORKSPACE/themes/mystical/wallpaper/contents/images/1920x1080.svg"
          fi

      - name: Validate shell scripts
        run: |
          bash -n scripts/lydsys
          bash -n scripts/lydsetup
          bash -n scripts/lydhelp
          bash -n scripts/lyd-btrfs-postinstall
          bash -n scripts/lyd-firewall-postinstall
          bash -n scripts/stage-grub-btrfs.sh
          bash -n "profiles/${{ matrix.profile }}/config/includes.chroot/etc/grub.d/41_snapshots-btrfs"
          bash -n scripts/install-mystical-theme.sh
          bash -n scripts/lyd-mystical-first-login
          bash -n scripts/install-grub-theme.sh
          sh -n scripts/9999-grub-theme.hook.binary
          bash -n scripts/build-iso.sh
          sh -n profiles/desktop/auto/config
          sh -n profiles/server/auto/config

      - name: Build ISO
        working-directory: profiles/${{ matrix.profile }}
        run: |
          chmod +x auto/config
          lb clean --purge
          lb config
          lb build
          SOURCE_ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$SOURCE_ISO"
          ISO="lyd-deb-${{ matrix.profile }}.iso"
          mv -- "$SOURCE_ISO" "$ISO"
          sha256sum "$ISO" > "$ISO.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-iso
          path: |
            profiles/${{ matrix.profile }}/*.iso
            profiles/${{ matrix.profile }}/*.iso.sha256
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository for the recombination helper
        uses: actions/checkout@v4

      - name: Download both ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Split ISOs into GitHub-compatible release assets
        run: |
          set -euo pipefail
          # GitHub Releases rejects individual assets at or above 2 GiB.
          # Keep each part below that limit and retain the original ISO checksum.
          for iso in release-assets/*.iso; do
            [ -f "$iso" ] || continue
            split --bytes=1900M --numeric-suffixes=0 --suffix-length=3 \
              "$iso" "$iso.part-"
            rm -- "$iso"
          done
          install -m 0644 scripts/recombine-isos.sh release-assets/recombine-isos.sh

      - name: Publish rolling latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
          TARGET_SHA: ${{ github.sha }}
        run: |
          # The GitHub CLI deletes the release and its tag through the API.
          # The checkout supplies the recombination helper; --repo keeps gh explicit.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "lyd Debian Live - Latest" \
            --notes "Automatically updated from the latest successful build of the main branch.\n\nCommit: $TARGET_SHA\n\nThis is a rolling development build; assets are replaced by the next successful main-branch build." \
            --prerelease

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "lyd Debian Live $TAG" \
            --generate-notes
