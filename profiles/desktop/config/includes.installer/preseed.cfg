# lyd Debian Live installer defaults.
# This is a guided partitioning default, not an unattended disk wipe.
# The installer still asks which disk to use and requires confirmation
# before writing the partition table.

d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select lyd-btrfs
d-i partman-auto/expert_recipe string \
    lyd-btrfs :: \
        1024 1024 1024 free \
            $iflabel{ gpt } $reusemethod{ } \
            method{ efi } format{ } \
        . \
        8192 8192 8192 linux-swap \
            method{ swap } format{ } \
        . \
        10000 100000 -1 btrfs \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ btrfs } \
            mountpoint{ / } \
        .

# Debian Installer creates its Btrfs root as @rootfs. Finish the Ark-style
# layout after the target system has been installed, without selecting a disk
# or suppressing the installer's final partition confirmation.
d-i preseed/late_command string in-target /usr/local/sbin/lyd-btrfs-postinstall
